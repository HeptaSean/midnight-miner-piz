name: Deploy to GitHub Pages

on:
  push:
    branches: [piz]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout piz branch
        uses: actions/checkout@v4
        with:
          ref: piz

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: cli_hunt/donate_to

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
